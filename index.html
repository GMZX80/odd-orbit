<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07131d" />
    <title>Odd Orbit</title>
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>

      <section id="menu-screen" class="screen screen-visible" aria-label="Odd Orbit title screen">
        <div class="brand-lockup">
          <span class="kicker">Tiny Ship. Huge Bad Decisions.</span>
          <h1>Odd Orbit</h1>
          <p>
            Grow a tiny swarm by shooting numbered cards before choosing which lane
            to crash into.
          </p>
        </div>
        <button id="start-run" class="primary-action" type="button">Launch Run</button>
      </section>

      <section id="hud" class="hud" aria-live="polite">
        <div class="hud-row">
          <span id="hud-units">Units: 1</span>
          <span id="hud-distance">0%</span>
        </div>
      </section>

      <section id="result-screen" class="screen" aria-label="Run results">
        <div class="result-mark" id="result-mark">RUN COMPLETE</div>
        <h2 id="result-title">Destination Reached</h2>
        <p id="result-copy"></p>
        <div id="result-rewards" class="reward-grid"></div>
        <button id="retry-run" class="primary-action" type="button">Fly Again</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
